# 노동 금액 사건 형식 예시 (가상 사건 — 실제 사건 아님)
# 퇴직 근로자의 통상임금 재산정: 시간외수당·연차휴가수당·퇴직금 차액 + 지연손해금
# 절마다 키 설명은 engine/labor/{모듈}.py 머리 docstring. 값마다 실제 사건에서는 "# 근거: 파일 쪽" 을 단다.
kind: labor
case_no: "2025가단0000"
name: "홍길동"
employer: "주식회사 가상"

worker:
  hire_date: 2021-03-02
  last_working_day: 2025-06-30
  small_business_periods: []
  employer_merchant: true
  pay_period_start_day: 1
  pay_day: 25
  pay_month_offset: 0

ordinary:
  wage_form: monthly
  from: 2022-07-01
  to: 2025-06-30
  hours:
    - {from: 2022-07-01, weekly_hours: 40, daily_hours: 8, weekly_paid_hours: 0, source: "근로계약서 1쪽"}
  items:
    - {name: 기본급, amount: 2500000, cycle: month, from: 2022-07-01, to: 2024-12-31, old: true, new: true, source: "근로계약서 1쪽"}
    - {name: 기본급, amount: 2700000, cycle: month, from: 2025-01-01, to: null, old: true, new: true, source: "2025 연봉계약서"}
    - {name: 식대, amount: 200000, cycle: month, from: 2022-07-01, to: null, old: true, new: true, source: "급여규정 5조"}
    - {name: 정기상여금, amount: 2500000, cycle: quarter, from: 2022-07-01, to: 2024-12-31, old: false, new: true,
       parallel: false, source: "급여규정 7조(지급일 재직자)"}
    - {name: 정기상여금, amount: 2700000, cycle: quarter, from: 2025-01-01, to: null, old: false, new: true,
       parallel: false, source: "급여규정 7조(지급일 재직자)"}

overtime:
  size_band: "5-29"
  inclusive_wage: none
  months:
    - {period: "2024-10", overtime_hours: 20, paid: {overtime: 400000}}
    - {period: "2024-11", overtime_hours: 20, paid: {overtime: 400000}}
    # 2024. 12. 19. 통상임금 법리 변경일이 걸친 달은 from/to 로 나눈다(근태기록상 날짜별 시간)
    - {period: "2024-12", from: 2024-12-01, to: 2024-12-18, overtime_hours: 12}
    - {period: "2024-12", from: 2024-12-19, to: 2024-12-31, overtime_hours: 8}
    - {period: "2025-01", overtime_hours: 20, paid: {overtime: 430000}}
    - {period: "2025-02", overtime_hours: 20, paid: {overtime: 430000}}
    - {period: "2025-03", overtime_hours: 20, paid: {overtime: 430000}}
    - {period: "2025-04", overtime_hours: 20, paid: {overtime: 430000}}
    - {period: "2025-05", overtime_hours: 20, paid: {overtime: 430000}}
    - {period: "2025-06", overtime_hours: 20, paid: {overtime: 430000}}
  paid:                      # 나눠 적은 달의 기지급액은 기간 단위로 한 번만
    - {period: "2024-12", overtime: 400000}

leave:
  weekly_hours: 40
  daily_hours: 8
  assume_full_attendance: true
  periods:
    - {used_monthly_days: 11, used_days: 15}
    - {used_days: 15}
    - {used_days: 16}
    - {used_days: 10}

average_wage:
  wages:
    # 기지급 연장수당도 임금총액에 넣는다. 재산정 증가분은 overtime 결과(extra_wages)가 자동으로 더해진다
    - {month: "2025-04", items: {기본급: 2700000, 식대: 200000, 연장근로수당: 430000}}
    - {month: "2025-05", items: {기본급: 2700000, 식대: 200000, 연장근로수당: 430000}}
    - {month: "2025-06", items: {기본급: 2700000, 식대: 200000, 연장근로수당: 430000}}
  bonuses:
    - {paid_date: 2024-09-30, amount: 2500000}
    - {paid_date: 2024-12-31, amount: 2500000}
    - {paid_date: 2025-03-31, amount: 2700000}
    - {paid_date: 2025-06-30, amount: 2700000}

retirement:
  paid_severance: 11000000

interest:
  service_date: 2025-09-15
  suit_filed_date: 2025-09-01
  first_instance_judgment_date: 2026-10-15
  calc_until: 2026-10-15
  end_cause: resignation

options:
  # 판례가 갈려 기본값이 없는 옵션은 결과가 달라질 때 엔진이 멈추고 선택을 요구한다(사람 확인 단계에서 정함)
  ot_overpayment_character: contractual
  ot_compare_unit: month
