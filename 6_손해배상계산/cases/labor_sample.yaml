# 노동 금액 계산 입력 형식 예시 — 퇴직 근로자의 통상임금 재산정 사건.
#
# 실제 사건 자료가 아니라 형식을 보여 주기 위해 지어낸 값이다. 사람 이름과 회사 이름,
# 금액, 근무 기록 모두 가공한 것이다. 사건 자료는 이 폴더에 두되 git 에 올리지 않는다.
#
# 절마다 어떤 키를 쓸 수 있는지는 engine/labor/{모듈}.py 머리 docstring 에 있고,
# 규칙·옵션·상태는 노동금액-계산기준.md 에 있다.
#
#     python cli.py cases/labor_sample.yaml -o 노동금액계산표.xlsx
#
# 부당해고 사건(해고기간 임금·중간수입 공제)의 형식은 cases/labor_dismissal_sample.yaml 에 있다.

kind: labor
case_no: "2026가합100001"
name: 김노동
employer: 주식회사 평안산업

worker:
  hire_date: 2021-01-01
  last_working_day: 2025-06-30
  pay_day: 25                 # 매월 25일 지급
  pay_period_start_day: 1     # 임금산정기간은 매월 1일 시작
  employer_merchant: true     # 상인이므로 20% 미적용 구간은 연 6%

# ── 통상임금 ────────────────────────────────────────────────────────────
# 항목별 구 법리(2024. 12. 18.까지)·신 법리(2024. 12. 19.부터) 산입 여부는 사람이 판정해 적는다.
# 엔진은 통상임금성을 판단하지 않는다.
ordinary:
  wage_form: monthly
  from: 2022-01-01
  to: 2025-06-30
  hours:
    - from: 2021-01-01
      weekly_hours: 40
      daily_hours: 8
      source: "근로계약서 2쪽"
  items:
    - name: 기본급
      amount: 3000000
      cycle: month
      from: 2021-01-01
      old: true
      new: true
      source: "근로계약서 2쪽, 급여명세서"
    - name: 정기상여금
      amount: 1500000
      cycle: quarter           # 분기 1회. 월 환산 = 1,500,000 × 4 ÷ 12
      from: 2021-01-01
      old: false               # 재직조건부 — 구 법리에서는 고정성 부정
      new: true                # 신 법리에서는 전액 산입(2020다247190)
      parallel: false
      source: "단체협약 제30조"
    - name: 식대
      amount: 200000
      cycle: month
      from: 2021-01-01
      old: true
      new: true
      source: "급여명세서"

# ── 시간외수당 차액 ─────────────────────────────────────────────────────
overtime:
  week_start: monday
  size_band: "50-299"
  scheduled_daily_hours: 8
  scheduled_weekly_hours: 40
  claim_from: 2022-07-01       # 소멸시효 3년을 감안한 청구 기간
  claim_to: 2025-06-30
  months:
    - period: "2024-10"
      overtime_hours: 20
      night_hours: 6
      holiday_le8_hours: 8
      paid: {overtime: 430000, night: 65000, holiday: 172000}
    - period: "2024-11"
      overtime_hours: 18
      night_hours: 4
      paid: {overtime: 387000, night: 43000}
    # 2024. 12. 19. 신 법리가 걸친 달은 반드시 from/to 로 나눈다.
    # 나누지 않으면 엔진이 '통상시급이 바뀝니다' 오류로 멈춘다.
    - period: "2024-12"
      from: 2024-12-01
      to: 2024-12-18            # 구 법리 구간
      overtime_hours: 13
      night_hours: 5
      # 한 달을 나눈 경우 기지급액은 한 줄에만 적는다(그 달의 합계).
      paid: {overtime: 473000, night: 86000}
    - period: "2024-12"
      from: 2024-12-19
      to: 2024-12-31            # 신 법리 구간
      overtime_hours: 9
      night_hours: 3
    - period: "2025-01"
      overtime_hours: 16
      night_hours: 4
      paid: {overtime: 344000, night: 43000}
    - period: "2025-02"
      overtime_hours: 12
      paid: {overtime: 258000}
    - period: "2025-03"
      overtime_hours: 20
      night_hours: 6
      paid: {overtime: 430000, night: 65000}

# ── 미사용 연차휴가수당 ─────────────────────────────────────────────────
leave:
  weekly_hours: 40
  daily_hours: 8
  periods:
    - start: 2022-01-01
      scheduled_days: 248
      attended_days: 245
      used_days: 10
      paid_amount: 0
    - start: 2023-01-01
      scheduled_days: 249
      attended_days: 247
      used_days: 8
      paid_amount: 0
    - start: 2024-01-01
      scheduled_days: 248
      attended_days: 246
      used_days: 9
      paid_amount: 0

# ── 평균임금 ────────────────────────────────────────────────────────────
average_wage:
  wages:
    - month: "2025-04"
      items: {기본급: 3000000, 식대: 200000}
    - month: "2025-05"
      items: {기본급: 3000000, 식대: 200000}
    - month: "2025-06"
      items: {기본급: 3000000, 식대: 200000}
  bonuses:
    - {paid_date: 2024-09-25, amount: 1500000, include: true}
    - {paid_date: 2024-12-25, amount: 1500000, include: true}
    - {paid_date: 2025-03-25, amount: 1500000, include: true}
    - {paid_date: 2025-06-25, amount: 1500000, include: true}

# ── 퇴직금 차액 ─────────────────────────────────────────────────────────
retirement:
  paid_severance: 18000000     # 회사가 낮은 평균임금으로 계산해 지급한 금액
  weekly_hours: 40

# ── 지연손해금·소멸시효 ─────────────────────────────────────────────────
interest:
  employer_merchant: true
  end_cause: retirement
  first_instance_judgment_date: 2026-10-15   # 선고(예정)일. 이 날까지 20% 배제
  suit_filed_date: 2026-03-02
  calc_until: 2026-10-15

# ── 법적 판단(옵션) ─────────────────────────────────────────────────────
# 판례가 갈리거나 확인되지 않은 지점이다. 기본값이 없는 옵션은 결과가 달라질 때
# 엔진이 멈추고 선택을 요구한다. 추측해서 채우지 않고 사람이 정한다.
# 고를 수 있는 값과 근거는 노동금액-계산기준.md 에 있다.
options:
  # 약정 수당을 법정액보다 더 준 달의 초과분을 어떻게 볼 것인지(OT-18, 불명확)
  ot_overpayment_character: erroneous
